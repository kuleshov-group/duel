[project]
name = "duel"
version = "0.1.0"
description = "DUEL: exact likelihood for masked diffusion models via deterministic unmasking (minimal reference implementation)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers==4.49.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
